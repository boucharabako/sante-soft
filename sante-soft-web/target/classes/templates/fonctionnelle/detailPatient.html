<!-- Modal Patient -->
<div class="modal fade compose-modal" id="detail-patient" tabindex="-1" role="dialog" aria-hidden="true" style="max-height: 100%; margin: 50px 10px 50px -90px;">
    <div class="modal-dialog">
        <div class="modal-content" style="width:200%; height: 70%;">
            <div class="modal-header">
                <h5 class="modal-title mt-0" id="exampleModalLabel">{{titleModale}}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="form-group row d-flex align-items-end">
                            <!-- Informations d'identification -->
                            <div class="col-sm-6">
                                <label class="control-label">Nom d'utilisateur *</label>
                                <input class="form-control" ng-model="objetPatient.username" required />
                            </div>
                            <div class="col-sm-6" ng-if="modeEdition === 0">
                                <label class="control-label">Mot de passe *</label>
                                <input type="password" class="form-control" ng-model="objetPatient.password" required />
                            </div>
                            <div class="col-sm-6" ng-if="modeEdition === 0">
                                <label class="control-label">Confirmer mot de passe *</label>
                                <input type="password" class="form-control" ng-model="objetPatient.confirmPassword" required />
                            </div>

                            <!-- Informations personnelles -->
                            <div class="col-sm-6">
                                <label class="control-label">Nom *</label>
                                <input class="form-control" ng-model="objetPatient.lastName" required />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Prénom *</label>
                                <input class="form-control" ng-model="objetPatient.firstName" required />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Sexe *</label>
                                <select class="form-control" ng-model="objetPatient.sexe" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option data-ng-repeat="se in listeSexes" value="{{se.id}}">{{se.libelle}}</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Date de naissance *</label>
                                <input type="date" class="form-control" ng-model="objetPatient.dateNaissance" required
                                       max="{{maxDate}}" title="La date de naissance doit être inférieure ou égale à aujourd'hui" />
                            </div>

                            <!-- Informations de contact -->
                            <div class="col-sm-6">
                                <label class="control-label">Email</label>
                                <input type="email" class="form-control" ng-model="objetPatient.email" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Téléphone</label>
                                <div class="input-group">
                                    <span class="input-group-addon" style="background-color: #fff; border-right: none; padding: 6px 12px;">
                                        <span style="font-size: 20px;">🇹🇬</span>
                                        <span style="margin-left: 5px; color: #636e72;">+228</span>
                                    </span>
                                    <input type="tel" class="form-control" ng-model="objetPatient.tel"
                                           pattern="[0-9]{8}" maxlength="8"
                                           placeholder="12345678"
                                           title="Veuillez saisir exactement 8 chiffres"
                                           style="border-left: none;" />
                                </div>
                            </div>

                            <!-- Informations médicales -->
                            <div class="col-sm-6">
                                <label class="control-label">Numéro Carnet *</label>
                                <input class="form-control" ng-model="objetPatient.numeroCarnet" required readonly
                                       style="background-color: #e9ecef; cursor: not-allowed;"
                                       title="Le numéro de carnet est généré automatiquement" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Groupe Sanguin </label>
                                <select class="form-control" ng-model="objetPatient.groupeSanguin">
                                    <option value="">-- Sélectionner --</option>
                                    <option data-ng-repeat="gs in listeGroupesSanguins" value="{{gs.id}}">{{gs.libelle}}</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Date Enregistrement *</label>
                                <input type="datetime-local" class="form-control" ng-model="objetPatient.dateEnregistrement"
                                       required readonly
                                       style="background-color: #e9ecef; cursor: not-allowed;"
                                       title="La date d'enregistrement est générée automatiquement" />
                            </div>
                        </div>
                        <div class="form-group row d-flex align-items-end" style="margin-left: 65%;">
                            <span name="add" class="btn btn-primary" style="margin-left: 20px;"
                                  ng-if="modeEdition === 0" ng-click="savePatient(objetPatient)">Ajouter
                            </span>
                            <span name="add" ng-if="modeEdition === 3" class="btn btn-primary" style="margin-left: 20px;"
                                  ng-click="savePatient(objetPatient)">Modifier
                            </span>
                            <span ng-if="modeEdition === 0" class="btn btn-primary" style="margin-left: 20px;" ng-click="savePatientEtContinuer(objetPatient)">
                                Ajouter et continuer
                            </span>
                            <span class="btn btn-primary" style="margin-left: 20px;" ng-click="closeModalPatient()">
                                <i class="fas fa-sign-out-alt"></i>
                            </span>
                        </div>
                    </div><!--end col-->
                </div><!--end row-->
            </div>
        </div>
    </div>
</div>
