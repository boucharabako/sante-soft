<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorator="template">
<head>
    <title>Produit List</title>
    <link th:href="@{/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/plugins/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet"/>
    <link th:href="@{/plugins/datatables/responsive.bootstrap4.min.css}" rel="stylesheet"/>
    <script th:src="@{/js/controllers/produitController.js}"></script>
    <style type="text/css">
        .product-image {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div layout:fragment="content" id="productList" data-ng-cloak="">
        <div class="row" ng-controller="produitController" data-ng-cloak="">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mt-0 header-title">Filtrer les Produits</h4>
                        <form method="POST" class="form-horizontal well">
                            <fieldset>
                                <div class="repeater-default">
                                    <div data-repeater-list="filter">
                                        <div data-repeater-item="">
                                            <div class="form-group row d-flex align-items-end">
                                                <div class="col-sm-3">
                                                    <label class="control-label">Code</label>
                                                    <input type="text" name="filter[0][code]" ng-model="searchObject.code" class="form-control">
                                                </div>
                                                <div class="col-sm-3">
                                                    <label class="control-label">Libelle</label>
                                                    <input type="text" name="filter[0][libelle]" ng-model="searchObject.libelle" class="form-control">
                                                </div>
                                                <div class="col-sm-3">
                                                    <label class="control-label">Type Produit</label>
                                                    <select class="form-control" id="typeProduit" ng-model="searchObject.typeProduit">
                                                        <option></option>
                                                        <option data-ng-repeat="type in listeTypeProduits" value="{{type.id}}">{{type.libelleTypeProduit}}</option>
                                                    </select>
                                                </div>
<!--                                                <div class="col-sm-3">
                                                    <label class="control-label">Date Ajout</label>
                                                    <input type="date" name="filter[0][dateAjout]" ng-model="searchObject.dateAjout" class="form-control">
                                                </div>
                                                <div class="col-sm-3">
                                                    <label class="control-label">Quantité Min</label>
                                                    <input type="number" name="filter[0][quantiteMin]" ng-model="searchObject.quantiteMin" class="form-control">
                                                </div>
                                                <div class="col-sm-3">
                                                    <label class="control-label">Quantité Max</label>
                                                    <input type="number" name="filter[0][quantiteMax]" ng-model="searchObject.quantiteMax" class="form-control">
                                                </div>-->
                                                <div class="col-sm-2">
                                                    <label class="control-label">Mot clé</label>
                                                    <input type="text" name="filter[0][mc]" class="form-control" ng-model="searchObject.mc">
                                                </div>
                                                <div class="col-sm-1">
                                                    <span data-repeater-delete="" class="btn btn-gradient-primary btn-sm">
                                                        <span class="mdi mdi-filter" ng-click="listeProduits()"></span>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mt-0 header-title">Liste des Produits</h4>
                        <div id="product_table_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                            <div class="row">
                                <div class="col-sm-12 col-md-6">
                                    <div class="dataTables_length" id="product_table_length">
                                        <label>Affiché
                                            <select name="product_table_length" aria-controls="product_table" ng-change="changePageSize()" class="custom-select custom-select-sm form-control form-control-sm" ng-model="pageSizeSelect" data-ng-options="nb for nb in pageSizes" id="pageSizeSelect">
                                            </select>
                                            lignes par page
                                        </label>
                                    </div>
                                </div>
                                <div class="col-sm-12 col-md-6">
                                    <div id="product_table_filter" class="dataTables_filter">
                                        <div class="form-group mb-0 row">
                                            <div class="col-sm-12">
                                                <button type="button" class="btn btn-gradient-primary" ng-click="addProduit()"><i class="fas fa-plus"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <table id="product_table" class="table table-striped table-bordered dt-responsive nowrap dataTable no-footer dtr-inline" style="width: 100%;" role="grid" aria-describedby="product_table_info">
                                        <thead>
                                            <tr role="row">
                                                <th class="sorting_disabled" style="width: 10%;">Code</th>
                                                <th class="sorting_disabled" style="width: 20%;">Libelle</th>
                                                <th class="sorting_disabled" style="width: 30%;">Description</th>
                                                <th class="sorting_disabled" style="width: 10%;">Type Produit</th>
                                                <th class="sorting_disabled" style="width: 10%;">Quantité</th>
                                                <th class="sorting_disabled" style="width: 10%;">Prix en fcfa</th>
                                                <th class="sorting_disabled" style="width: 10%;">Image</th>
                                                <th class="sorting_disabled" style="width: 10%;">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr role="row" data-ng-repeat="p in listProduits track by $index">
                                                <td data-ng-bind="p.code" style="width: 10%;"></td>
                                                <td data-ng-bind="p.libelle" style="width: 20%;"></td>
                                                <td data-ng-bind="p.description" style="width: 30%;"></td>
                                                <td data-ng-bind="p.libelleTypeProduit" style="width: 10%;"></td>
                                                <td data-ng-bind="p.quantite" style="width: 10%;"></td>
                                                <!--<td data-ng-bind="p.prix | currency:'fcfa ':0" style="width: 10%;"></td>-->
                                                <td data-ng-bind="p.prix" style="width: 10%;"></td>
                                                <td style="width: 10%;">
                                                    <img ng-src="{{p.image}}" alt="{{p.libelle}}" class="product-image"/>
                                                </td>
                                                <td style="width: 10%;">
                                                    <div class="btn-group mb-4">
                                                        <button type="button" class="btn btn-primary" ng-click="editProduit(p.id)">Modifier</button>
                                                        <button type="button" class="btn btn-danger" ng-click="deleteProduit(p.id)">Supprimer</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" ng-if="listProduits.length == 0">
                                    <center style="font-style: italic;">Aucun produit trouvé</center>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12 col-md-5" data-ng-if="listProduits.length !== 0">
                                    <div class="dataTables_info" id="product_table_info" role="status" aria-live="polite">Affichage de {{pageSizeSelect * (listPage.number + 1) - pageSizeSelect + 1}} à {{pageSizeSelect * (listPage.number + 1)}} de {{totalElements}} lignes</div>
                                </div>
                                <div class="col-sm-12 col-md-7" data-ng-if="listProduits.length !== 0">
                                    <div class="dataTables_paginate paging_simple_numbers" id="product_table_paginate">
                                        <ul class="pagination">
                                            <li class="paginate_button page-item previous" id="product_table_previous">
                                                <button aria-controls="product_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number === 0" data-ng-click="paginate(pageSizeSelect, 1)" class="page-link"><i class="mdi mdi-skip-backward"></i></button>
                                            </li>
                                            <li class="paginate_button page-item previous" id="product_table_previous">
                                                <button aria-controls="product_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number === 0" data-ng-click="paginate(pageSizeSelect, listPage.number)" class="page-link"><i class="mdi mdi-chevron-left"></i></button>
                                            </li>
                                            <li class="paginate_button page-item next" id="product_table_next">
                                                <button aria-controls="product_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number >= totalPages - 1" data-ng-click="paginate(pageSizeSelect, listPage.number + 2)" class="page-link"><i class="mdi mdi-chevron-right"></i></button>
                                            </li>
                                            <li class="paginate_button page-item next" id="product_table_next">
                                                <button aria-controls="product_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number >= totalPages - 1" data-ng-click="paginate(pageSizeSelect, totalPages)" class="page-link"><i class="mdi mdi-skip-forward"></i></button>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div  th:include="fonctionnelle/detailProduit">

                </div>
        </div>
    </div>
</body>
</html>
