<!-- Modal Produit -->
<div class="modal fade compose-modal" id="detail-produit" tabindex="-1" role="dialog" aria-hidden="true" style="max-height: 100%; margin: 50px 10px 50px -90px;">
    <div class="modal-dialog">
        <div class="modal-content" style="width:200%; height: 70%;">
            <div class="modal-header">
                <h5 class="modal-title mt-0" id="exampleModalLabel">{{titleModale}}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="form-group row d-flex align-items-end">
                            <div class="col-sm-6">
                                <label class="control-label">Code</label>
                                <input class="form-control" ng-model="objetProduit.code" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Libelle</label>
                                <input class="form-control" ng-model="objetProduit.libelle" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Description</label>
                                <textarea class="form-control" ng-model="objetProduit.description"></textarea>
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Type Produit</label>
                                <select class="form-control" ng-model="objetProduit.typeProduit">
                                    <option value="1"></option>
                                    <option data-ng-repeat="tp in listeTypeProduits" value="{{tp.id}}">{{tp.libelleTypeProduit}}</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Quantité</label>
                                <input type="number" class="form-control" ng-model="objetProduit.quantite" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Prix</label>
                                <input type="number" class="form-control" ng-model="objetProduit.prix" />
                            </div>
                            <div class="col-sm-6">
                                <label class="control-label">Image</label>
                                <input type="file" class="form-control" ng-model="objetProduit.image" onchange="angular.element(this).scope().uploadImage(this)"/>
                            </div>
                        </div>
                        <div class="form-group row d-flex align-items-end" style="margin-left: 65%;">
                            <span name="add" class="btn btn-primary" style="margin-left: 20px;"
                                  ng-if="modeEdition === 0" ng-click="saveProduit(objetProduit)">Ajouter
                            </span>
                            <span name="add" ng-if="modeEdition === 3" class="btn btn-primary" style="margin-left: 20px;"
                                  ng-click="saveProduit(objetProduit)">Modifier
                            </span>
                            <span ng-if="modeEdition === 0" class="btn btn-primary" style="margin-left: 20px;" ng-click="saveProduitEtContinuer(objetProduit)">
                                Ajouter et continuer
                            </span>
                            <span class="btn btn-primary" style="margin-left: 20px;" ng-click="closeModalProduit()">
                                <i class="fas fa-sign-out-alt"></i>
                            </span>
                        </div>
                    </div><!--end col-->
                </div><!--end row-->
            </div>
        </div>
    </div>
</div>
