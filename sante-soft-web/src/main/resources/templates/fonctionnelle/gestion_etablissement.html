<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="template">
<head>
    <title>Etablissement</title>
    <link th:href="@{/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/plugins/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet"/>
    <link th:href="@{/plugins/datatables/responsive.bootstrap4.min.css}" rel="stylesheet"/>
    <script th:src="@{/js/controllers/etablissementController.js}"></script>

    <style>
        /* Arrière-plan de la page */
        #etablissementList {
            background-color: #b8c6db !important;
        }

        /* Titres des sections */
        .header-title {
            font-size: 20px !important;
            font-weight: 700 !important;
            color: #1a1a1a !important;
            text-transform: none !important;
        }

        /* Labels des formulaires */
        label.control-label {
            font-size: 15px !important;
            font-weight: 700 !important;
            color: #2c3e50 !important;
        }

        /* Champs de formulaire */
        .form-control {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #1a1a1a !important;
            border: 2px solid #495057 !important;
        }

        /* En-têtes du tableau */
        .table thead th {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #1a1a1a !important;
            background-color: #e9ecef !important;
        }

        /* Cellules du tableau */
        .table tbody td {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #2c3e50 !important;
        }

        /* Informations de pagination */
        .dataTables_info {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #2c3e50 !important;
        }

        .dataTables_length label {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #2c3e50 !important;
        }

        /* Message "Aucun établissement" */
        center {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #2c3e50 !important;
        }

        /* Boutons */
        .btn {
            font-size: 15px !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content" id="etablissementList" data-ng-cloak="">
        <div class="row" ng-controller="etablissementController" data-ng-cloak="">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mt-0 header-title">Filtrer les établissements</h4>
                        <form method="POST" class="form-horizontal well">
                            <fieldset>
                                <div class="repeater-default">
                                    <div data-repeater-list="filter">
                                        <div data-repeater-item="">
                                            <div class="form-group row d-flex align-items-end">
                                                <div class="col-sm-3">
                                                    <label class="control-label">Code</label>
                                                    <input type="text" name="filter[0][code]" ng-model="searchObject.code" class="form-control">
                                                </div>
                                                <div class="col-sm-3">
                                                    <label class="control-label">Libellé</label>
                                                    <input type="text" name="filter[0][libelle]" ng-model="searchObject.libelle" class="form-control">
                                                </div>
                                                <div class="col-sm-2">
                                                    <label class="control-label">Région</label>
                                                    <input type="text" name="filter[0][region]" ng-model="searchObject.region" class="form-control">
                                                </div>
                                                <div class="col-sm-2">
                                                    <label class="control-label">Type</label>
                                                    <select class="form-control" id="typeEtablissement" ng-model="searchObject.typeEtablissement">
                                                        <option></option>
                                                        <option data-ng-repeat="type in listeTypeEtablissements" value="{{type.id}}">{{type.libelle}}</option>
                                                    </select>
                                                </div>
                                                <div class="col-sm-1">
                                                    <label class="control-label">Mot clé</label>
                                                    <input type="text" name="filter[0][mc]" class="form-control" ng-model="searchObject.mc">
                                                </div>
                                                <div class="col-sm-1">
                                                    <span data-repeater-delete="" class="btn btn-gradient-primary btn-sm">
                                                        <span class="mdi mdi-filter" ng-click="listeEtablissements()"></span>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mt-0 header-title">Liste des Établissements</h4>
                        <div id="etablissement_table_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer">
                            <div class="row">
                                <div class="col-sm-12 col-md-6">
                                    <div class="dataTables_length" id="etablissement_table_length">
                                        <label>Affiché
                                            <select name="etablissement_table_length" aria-controls="etablissement_table" ng-change="changePageSize()" class="custom-select custom-select-sm form-control form-control-sm" ng-model="pageSizeSelect" data-ng-options="nb for nb in pageSizes" id="pageSizeSelect">
                                            </select>
                                            lignes par page
                                        </label>
                                    </div>
                                </div>
                                <div class="col-sm-12 col-md-6">
                                    <div id="etablissement_table_filter" class="dataTables_filter">
                                        <div class="form-group mb-0 row">
                                            <div class="col-sm-12">
                                                <button type="button" class="btn btn-gradient-primary" ng-click="addEtablissement()"><i class="fas fa-plus"></i> Ajouter</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <table id="etablissement_table" class="table table-striped table-bordered dt-responsive nowrap dataTable no-footer dtr-inline" style="width: 100%;" role="grid" aria-describedby="etablissement_table_info">
                                        <thead>
                                            <tr role="row">
                                                <th class="sorting_disabled" style="width: 10%;">Code</th>
                                                <th class="sorting_disabled" style="width: 20%;">Libellé</th>
                                                <th class="sorting_disabled" style="width: 15%;">Région</th>
                                                <th class="sorting_disabled" style="width: 15%;">Type</th>
                                                <th class="sorting_disabled" style="width: 30%;">Adresse</th>
                                                <th class="sorting_disabled" style="width: 10%;">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr role="row" data-ng-repeat="etab in listEtablissements track by $index">
                                                <td data-ng-bind="etab.codeEtablissement" style="width: 10%;"></td>
                                                <td data-ng-bind="etab.libelleEtablissement" style="width: 20%;"></td>
                                                <td data-ng-bind="etab.regionEtablissement" style="width: 15%;"></td>
                                                <td data-ng-bind="etab.typeEtablissementLibelle" style="width: 15%;"></td>
                                                <td data-ng-bind="etab.adresse" style="width: 30%;"></td>
                                                <td style="width: 10%;">
                                                    <div class="btn-group mb-4">
                                                        <button type="button" class="btn btn-sm" style="background-color: #3498db; color: white; border: none;" ng-click="editEtablissement(etab.id)" title="Modifier">
                                                            <i class="fas fa-edit"></i>
                                                        </button>
                                                        <button type="button" class="btn btn-sm" style="background-color: #e74c3c; color: white; border: none;" ng-click="deleteEtablissement(etab.id)" title="Supprimer">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" ng-if="listEtablissements.length == 0">
                                    <center style="font-style: italic;">Aucun établissement trouvé</center>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12 col-md-5" data-ng-if="listEtablissements.length !== 0">
                                    <div class="dataTables_info" id="etablissement_table_info" role="status" aria-live="polite">Affichage de {{pageSizeSelect * (listPage.number + 1) - pageSizeSelect + 1}} à {{pageSizeSelect * (listPage.number + 1)}} de {{totalElements}} lignes</div>
                                </div>
                                <div class="col-sm-12 col-md-7" data-ng-if="listEtablissements.length !== 0">
                                    <div class="dataTables_paginate paging_simple_numbers" id="etablissement_table_paginate">
                                        <ul class="pagination">
                                            <li class="paginate_button page-item previous" id="etablissement_table_previous">
                                                <button aria-controls="etablissement_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number === 0" data-ng-click="paginate(pageSizeSelect, 1)" class="page-link"><i class="mdi mdi-skip-backward"></i></button>
                                            </li>
                                            <li class="paginate_button page-item previous" id="etablissement_table_previous">
                                                <button aria-controls="etablissement_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number === 0" data-ng-click="paginate(pageSizeSelect, listPage.number)" class="page-link"><i class="mdi mdi-chevron-left"></i></button>
                                            </li>
                                            <li class="paginate_button page-item next" id="etablissement_table_next">
                                                <button aria-controls="etablissement_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number >= totalPages - 1" data-ng-click="paginate(pageSizeSelect, listPage.number + 2)" class="page-link"><i class="mdi mdi-chevron-right"></i></button>
                                            </li>
                                            <li class="paginate_button page-item next" id="etablissement_table_next">
                                                <button aria-controls="etablissement_table" data-dt-idx="0" tabindex="0" data-ng-disabled="listPage.number >= totalPages - 1" data-ng-click="paginate(pageSizeSelect, totalPages)" class="page-link"><i class="mdi mdi-skip-forward"></i></button>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div  th:include="fonctionnelle/detailEtablissement">

                </div>
        </div>
    </div>
</body>
</html>
