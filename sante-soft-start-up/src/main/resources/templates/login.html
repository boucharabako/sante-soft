    <body class="account-body accountbg">
        <div class="loader" ><img th:src="@{/assets/images/loading-gif.gif}"></div>
        <!-- Log In page -->
        <div class="container">
            <div class="row vh-100 ">
                <div class="col-12 align-self-center">
                    <div class="auth-page">
                        <div class="card auth-card shadow-lg">
                            <div class="card-body">
                                <div class="px-3">
                                    <div class="auth-logo-box">
                                        <!--<a th:href="@{/dashboard/analytics-index.html}" class="logo logo-admin"><img th:src="@{/assets/images/logov.ico}" height="55" alt="logo" class="auth-logo"></a>-->
                                        <a th:href="@{/dashboard/analytics-index.html}" class="logo logo-admin"><img th:src="@{/assets/images/carnetElectronique.png}" height="55" alt="logo" class="auth-logo"></a>
                                    </div><!--end auth-logo-box-->

                                    <div class="text-center auth-logo-text">
                                        <h4 class="mt-0 mb-3 mt-5">Carnet-e</h4>
                                        <p class="text-muted mb-0">Mon carnet de santé en poche 24h/24, 7j/7.</p>  
                                    </div> <!--end auth-logo-text-->  


                                    <form class="form-horizontal auth-form my-4" th:action="@{/login}" method="post">
                                        <div th:if="${param.error}">
                                            <div class="alert alert-danger">
                                                Nom d'utilisateur ou mot de passe invalide
                                            </div>
                                        </div>
                                        <div th:if="${errormsg}">
                                            <div class="alert alert-danger"
                                                 th:text="${errormsg}">
                                            </div>
                                        </div>
                                        <div th:if="${param.logout}">
                                            <div class="alert alert-info">
                                                vous avez été déconnecté.
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="username">Username</label>
                                            <div class="input-group mb-3">
                                                <span class="auth-form-icon">
                                                    <i class="dripicons-user"></i> 
                                                </span>                                                                                                              
                                                <input type="text" class="form-control" name="username" id="username" placeholder="Enter username">
                                            </div>                                    
                                        </div><!--end form-group--> 

                                        <div class="form-group">
                                            <label for="password">Password</label>                                            
                                            <div class="input-group mb-3"> 
                                                <span class="auth-form-icon">
                                                    <i class="dripicons-lock"></i> 
                                                </span>                                                       
                                                <input type="password" class="form-control" name="password" id="password" placeholder="Entrer password">
                                            </div>                               
                                        </div><!--end form-group--> 

                                        <div class="form-group row mt-4">
                                            <div class="col-sm-6">
                                                <div class="custom-control custom-switch switch-success">
                                                    <input type="checkbox" class="custom-control-input" id="customSwitchSuccess">
                                                    <!--<label class="custom-control-label text-muted" for="customSwitchSuccess">Remember me</label>-->
                                                </div>
                                            </div><!--end col--> 
                                            
                                            <div class="col-sm-6 text-right">
                                                
                                                <!--<a th:href="@{/resetpassword/reinitMail}" class="text-muted font-13"><i class="dripicons-lock"></i> Mot de passe oublié?</a>-->                                    
                                            </div><!--end col--> 
                                        </div><!--end form-group--> 

                                        <div class="form-group mb-0 row">
                                            <div class="col-12 mt-2">
                                                <button class="btn btn-gradient-primary btn-round btn-block waves-effect waves-light" type="submit">Connecter<i class="fas fa-sign-in-alt ml-1"></i></button>
                                            </div><!--end col--> 
                                        </div> <!--end form-group-->                           
                                    </form><!--end form-->
                                </div><!--end /div-->
