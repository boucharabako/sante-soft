            .myScrool{
                overflow-y: scroll; 
                height: 350px!important;
                max-height: 350px!important;
            }
            .row
            {
                margin-left: -20px;
                margin-right: -20px;
            }
            .second-card{
                box-shadow: 0 0px 15px 0 rgba(0, 0, 0, 0.09), 2px 4px 24px 0 rgba(0, 0, 0, 0.02);
            }
            fieldset.scheduler-border {
                border: 1px solid #c1bdbd !important;
                border-radius: 5px;
            }
            h4, strong, .text-muted {
                font-size: 17px;
            }
            .bg-gray
            {
                background-color: #cccccc  !important;
            }
            .bg-custom {
                background-color: #7e57c2 !important;
            }
            .alink{
                font-size: 11px;
            }
            .alink:link {
                color:black;
            }
            .alink:visited {
                color:black;
            }
            .alink:hover {
                color:#2bb605 !important;
            }
            .table-box .table-detail-b {
                display: inherit;
                vertical-align: middle;
                padding: 0;
                margin: -15px 0px 15px -10px;
            }
            .table-box .table-detail-n {
                display: inherit;
                margin-left: auto;
                margin-right: auto;
                font-weight: bold;

            }
            .custom-width{
                width: 20% !important;
            }
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f7f7f7;
            }

            header .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
                background-color: #2dbd9f;
            }

            header .top-bar .logo img {
                height: 40px;
            }

            header .top-bar .search-bar {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            header .top-bar .search-bar input {
                width: 300px;
                padding: 5px;
                border: none;
                border-radius: 5px;
            }

            header .top-bar .search-bar button {
                background-color: #ff5050;
                color: white;
                border: none;
                padding: 5px 10px;
                border-radius: 5px;
                margin-left: 5px;
            }

            header .top-bar .menu a {
                color: white;
                text-decoration: none;
                margin: 0 10px;
            }

            .banner img {
                width: 100%;
            }

            .flash-sales {
                background-color: white;
                padding: 20px;
                margin: 20px;
                border-radius: 10px;
            }

            .flash-sales .product-list {
                display: flex;
                justify-content: space-around;
            }

            .flash-sales .product {
                text-align: center;
            }

            .flash-sales .product img {
                max-width: 100px;
            }

            .flash-sales .product .price {
                color: #ff5050;
            }

            .flash-sales .product .old-price {
                text-decoration: line-through;
                color: grey;
                margin-left: 5px;
            }

            aside {
                position: fixed;
                right: 20px;
                top: 100px;
                width: 200px;
                background-color: white;
                padding: 10px;
                border-radius: 10px;
            }

            aside h3 {
                margin-top: 0;
            }

            footer {
                background-color: #2dbd9f;
                color: white;
                text-align: center;
                padding: 10px;
                position: fixed;
                bottom: 0;
                width: 100%;
            }
        </style>
        <style type="text/css">
            .side-menu.left {


            }
            .footer {

            }
            .content-page {

            }
        </style>

    <body>

        <div layout:fragment="content"  id="welcomen" data-id="profils" data-ng-cloak="" ng-controller="userController">
            <!-- Page-Title -->
             <div class="search-bar">
                <input type="text" placeholder="Flexofytol, Vitamines...">
                <button>🔍</button>
            </div>
            <div class="menu">
                <a href="#">Aide</a>
                <a href="#">Se connecter</a>
                <a href="#">Mon Panier</a>
            </div>
        </div>
    </header>
    <main>
        <section class="banner">
            <img src="checklist-banner.png" alt="Vérifiez votre pharmacie de vacances avec notre check-list">
        </section>
        <section class="flash-sales">
            <h2>Ventes Flash</h2>
            <div class="product-list">
                <div class="product">
                    <img src="nerixx.png" alt="Nerixx 30 Comprimés">
                    <p class="price">16.77€</p>
                </div>
                <div class="product">
                    <img src="flexofytol-forte.png" alt="Flexofytol Forte 84 Comprimés">
                    <p class="price">33.54€ <span class="old-price">59.9€</span></p>
                </div>
                <div class="product">
                    <img src="vinalac.png" alt="Vinalac DHA/EPA 60 Comprimés + 60 Capsules">
                    <p class="price">31.53€ <span class="old-price">48.5€</span></p>
                </div>
            </div>
        </section>
    </main>
    <aside>
        <div class="transporters">
            <h3>Nos transporteurs</h3>
            <ul>
                <li>bpost</li>
                <li>colissimo</li>
                <li>dpd</li>
            </ul>
        </div>
        <div class="loyalty">
            <h3>Votre fidélité récompensée</h3>
            <p>500 POINTS = 5€</p>
        </div>
        <div class="social">
            <h3>Rejoignez-nous sur Facebook!</h3>
        </div>
    </aside>
    <footer>
        <p>Pharmacodel.com est une pharmacie en ligne développée par la Pharmacie Centrale de Maurage.</p>
    </footer>
