        <script type="text/javascript">

            //jfofjfofofjo
            $(window).bind("load", function () {

            function usernames() {
                //                console.log("function usernames");
                $(".names").each(function () {
                    let urle = "" + $(this).attr("href");
                    let current = $(this);
                    $.ajax({
                        url: urle,
                        type: "GET",
                        success: function (data, textStatus, jqXHR) {
                            current.html(data.value);
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            //                            console.log("error:" + JSON.stringify(errorThrown));
                        }
                    });
                });
            }

            //initialiser l'ecran
            $(function () {

                var status = sessionStorage.getItem("status");
                if (typeof (status) === "undefined") {
                    $('.button-menu-mobile').click();
                } else if (status === 'enlarged') {
                    $('#main-content-page').css("margin-left", "70px");
                    $('.button-menu-mobile').click();
                    $('.list-unstyled').css("display", "table-column");
                } else {
                    $('#main-content-page').css("margin-left", "240px");
                    $('.list-unstyled').css("display", "block");
                }

            });
            $(function () {
                let menuCrnt = $("#welcomen").attr("data-id");
                let activeMenu = sessionStorage.getItem("nomClass");

                //                console.log("MENU ACTIVE  " + activeMenu);
                if (menuCrnt === "paramContexte") {
                    menuCrnt = activeMenu;
                }
                //                console.log("MENU CRNT " + menuCrnt);
                //                console.log("MENU ACTIVE MENU " + activeMenu);
                if (activeMenu != menuCrnt) {
                    if (activeMenu != '') {
                        $("." + activeMenu).removeClass("active");
                    }
                    sessionStorage.setItem("nomClass", menuCrnt);
                    var selector = sessionStorage.getItem("nomClass");
                    if (selector != '') {
                        $("." + selector).addClass("active");
                    }
                }
            });
            /**
             * fonction qui sauvegarde le menu sélectionné 
             * @param {type} nomClass
             * @returns {undefined}
             */
            function saveInSession(nomClass) {
                sessionStorage.setItem("nomClass", nomClass);
                $('.content').css("display", "none");
                $('.tabcont').css("display", "block");
            }

            /**
             * fonction qui sauvegarde le sous menu sélectionné
             * @param {type} event
             * @returns {undefined}
             */
            function getClassSession(event) {
                var myClas = $(event).attr('class');
                sessionStorage.setItem("clickMenuClass", myClas);
            }

            function viderLeContainer() {
                //                console.log("Trace !");
                //                console.log("Trace 2!");
                $('.tabcont').css("display", "none");
            }

            function afficherLeCont() {
                //                console.log("Trace !");
                //                console.log("Trace 2!");
                $('.tabcont').css("display", "block");
            }

            function jslog(logText) {
                console.log(logText);
            }
        </script>

        <script type="text/javascript">
            NProgress.start();
            showSpinner();

            $(function () {
                
                if ($("#msg_global").attr("data-msg-visible")) {
                    var type;
                    if ($("#msg_global").attr("data-alert") === "danger") {
                        type = 'error';
                    } else if ($("#msg_global").attr("data-alert") === "info") {
                        type = 'success';
                    } else {
                        type = $("#msg_global").attr("data-alert");
                    }
                    var detail = "";
                    $("#msg_global ul li").each(function (i, el) {
                        detail = detail + $(this).attr("data-message") + "<br/>";
                    });
                    $.Notification.notify(type, 'top right', $("#msg_global").attr("data-erreur-principal"),
                            detail);
                }
            });

            function getHeaderMenu() {
                doGet(("menu/header-value"),
                        function (data)
                        {

                            $(".header-t").html(data);
                        },
                        function (error)
                        {
//                            console.info(error)
                        });
            }

            function getLeftMenu() {
                doGet(("menu/left-value"),
                        function (data)
                        {
                            $(".left-t").html(data);
                            var selectedMenu = sessionStorage.getItem("nomClass");
                            var selectedSousMenu = sessionStorage.getItem("clickMenuClass");
                            //activer le menu
                            if (selectedMenu != '') {
                                $("." + selectedMenu).addClass('active');
                                //activer le sous menu du menu selectionné
                                $("." + selectedMenu + " " + "." + selectedSousMenu).closest('li').addClass('active');
                            }
                        },
                        function (error)
                        {
                            console.info(error);
                        });
            }

            function getOtherMenu() {
                console.log(window.location.pathname);
                doGet(("menu/other-value?url=" + window.location.pathname),
                        function (data)
                        {

                            $(".other-t").html(data);
                        },
                        function (error)
                        {
                            console.info(error);
                        });
            }
            function getClientName() {
                doGet(("menu/client-name"),
                        function (data)
                        {
                            $(".client-name-t").text(data);
                        },
                        function (error)
                        {

                        });
            }

            $(document).ready(function () {
                NProgress.done();
                hideSpinner();
                getAppTitle();
                getUsername();
                getAppName();
                getClientName();
                getHeaderMenu();
                getOtherMenu();
                getLeftMenu();
                getProfilMenu();
                getVersion();
                $('.counter').counterUp({
                    delay: 100,
                    time: 1200
                });
                $(".knob").knob();
                // Bind normal buttons
                $('.ladda-button').ladda('bind', {timeout: 2000});
                // Bind progress buttons and simulate loading progress
                Ladda.bind('.progress-demo .ladda-button', {
                    callback: function (instance) {
                        var progress = 0;
                        var interval = setInterval(function () {
                            progress = Math.min(progress + Math.random() * 0.1, 1);
                            instance.setProgress(progress);
                            if (progress === 1) {
                                instance.stop();
                                clearInterval(interval);
                            }
                        }, 200);
                    }
                });
                var l = $('.ladda-button-demo').ladda();
                l.click(function () {
                    // Start loading
                    l.ladda('start');
                    // Timeout example
                    // Do something in backend and then stop ladda
                    setTimeout(function () {
                        l.ladda('stop');
                    }, 12000);
                });
            });
        </script>
