<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org" 
      layout:decorator="template">
    <head>
        <title>Home</title>
        


        <script th:src="@{/js/controllers/utilisateursControllerV2.js}"></script>
    </head>
    <body>
        <section layout:fragment="content">

            <div class="row">
               
                <div class="col-12 grid-margin">
                    <div class="card">
                        <div class="card-body" id="welcomen" data-id="utilisateur" ng-cloak="" ng-controller="utilisateursControllerV2">
                            <h4 class="card-title">Ajout d'un utilisateur</h4>
                            <form class="form-sample">
                                <p class="card-description">
                                    Information Personnelle
                                </p>

                                <div class="col-sm-3" style="border : 0px solid #e0e0e0; height: 300px; margin-bottom: 10px; margin-left: 550px;">
                                    <img id="myImage" width="100%" height="260" th:attr="src=@{/api/picture/viewFile/user/} + *{id}"/>
                                    <input class="filestyle" data-buttontext="Choisir un fichier" data-buttonname="btn-white" data-size="sm" data-buttonbefore="true" id="upload-file-input" type="file" name="uploadfile" accept="image/*" />
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Nom</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" ng-model="objetUtilisateur.firstName" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Prénoms</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" ng-model="objetUtilisateur.lastName"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Username</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" ng-model="objetUtilisateur.username" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Mot de Passe</label>
                                            <div class="col-sm-9">
                                                <input type ="password" class="form-control" ng-model="objetUtilisateur.password"  />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Email</label>
                                            <div class="col-sm-9">
                                                <input type="email" class="form-control" ng-model="objetUtilisateur.email"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Confirmation de mot de passe</label>
                                            <div class="col-sm-9">
                                                <input  type ="password" class="form-control" ng-model="objetUtilisateur.confirmPassword"  />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Téléphone</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" ng-model="objetUtilisateur.tel" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Titre</label>
                                            <div class="col-sm-9">
                                                <input type="text" class="form-control" ng-model="objetUtilisateur.titre" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row" >
                                            <label class="col-sm-3 col-form-label">Profil(s)</label>
                                            <div class="col-sm-9" style="height: auto;min-height: 150px;max-height: 300px !important; overflow-x: scroll; overflow-y: scroll; width: 50%;  margin-bottom: 10px">
                                                <multiple-autocomplete 
                                                    ng-model="objectUtilisateur.profils"
                                                    object-property="intitule"
                                                    suggestions-arr="listeDesProfils" >
                                                    <!--ng-readonly="modeDetail() === true"-->
                                                </multiple-autocomplete>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Groupe(s)</label>
                                            <div class="col-sm-9" style="max-height: 300px !important; overflow-x: scroll; overflow-y: scroll; width: 50%;  margin-bottom: 10px">
                                                <multiple-autocomplete  
                                                    ng-model="objetUtilisateur.groupes"
                                                    object-property="intitule"
                                                    suggestions-arr="listeDesGroupes" >
                                                    <!--ng-readonly="modeDetail() === true"-->
                                                </multiple-autocomplete>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Statut</label>
                                            <div class="col-sm-9">
                                                <a class="label" data-toggle="modal" data-target="#tracking-modal" onclick="viewTracking(this)"
                                                   th:attr="data-row-id='{{objetUtilisateur.id}}'" data-concept-metier="{{objetUtilisateur.concepteMetier}}" style=" 
                                                   text-align: center; background-color: {{objetUtilisateur.statutDto.statutBackColor}}; color: {{objetUtilisateur.statutDto.statutTextColor}};">
                                                    <span data-ng-bind="objetUtilisateur.statutDto.libelle" ></span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group row" >
                                            <label class="col-sm-3 col-form-label">Est Agent?</label>
                                            <div class="col-sm-4">
                                                <div class="form-radio">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input" ng-model="objetUtilisateur.estAgent" name="membershipRadios" id="membershipRadios1" value="true" checked> Oui
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-sm-5">
                                                <div class="form-radio">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input"  ng-model="objetUtilisateur.estAgent" name="membershipRadios" id="membershipRadios2" value="false"> Non
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-sm-3 col-form-label">Date de Naissance</label>
                                            <div class="col-sm-9">
                                                <input type="date" class="form-control" placeholder="dd/mm/yyyy" ng-model="objetUtilisateur.dateNaissance"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group row" style="margin-left: 1300px;">
                                        <div style="margin-right: 10px;">
                                            <button  class="badge badge-primary" ng-click="saveUtilisateur(objetUtilisateur)">Ajouter</button>
                                        </div>
                                        <div style="margin-right: 10px;">
                                            <button class="badge badge-primary" ng-click="saveUtilisateur(objetUtilisateur)">Modifier</button>
                                        </div>
                                        <div >
                                            <button style="margin-right: 10px;"  class="badge badge-primary" ng-click="saveUtilisateurEtContinuer(objetUtilisateur)">Ajouter et Continuer</button>
                                        </div>
                                        <div >
                                            <button  class="badge badge-primary" ng-click="closeModalAddUser()">Quitter</button>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>


        </section>

    </body>
</html>
